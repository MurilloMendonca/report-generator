# Standalone local stack. Run through `sh scripts/local.sh up`.
# Separate project, database, workspace and env file from production/development.
services:
  app:
    build: .
    env_file: .env.local
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+psycopg://repgen:${POSTGRES_PASSWORD:?Run sh scripts/local.sh init}@postgres:5432/repgen
      PUBLIC_BASE_URL: http://localhost:${LOCAL_PORT:-8000}
      PDF_REPORT_COOKIE_SECURE: "0"
      PDF_REPORT_SIGNUP_MODE: closed
      PDF_REPORT_DEV_SERVER_KEYS: "0"
      PDF_REPORT_ALLOW_UNSAFE_SANDBOX: "0"
      PDF_REPORT_LLM_TIMEOUT_SECONDS: ${PDF_REPORT_LLM_TIMEOUT_SECONDS:-180}
      MPLCONFIGDIR: /tmp/matplotlib
    ports:
      - "127.0.0.1:${LOCAL_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - local-workspace:/app/workspace
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp=unconfined
      - apparmor=unconfined
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5).read()"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: repgen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run sh scripts/local.sh init}
      POSTGRES_DB: repgen
    volumes:
      - local-postgres:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repgen -d repgen"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  local-workspace:
  local-postgres:
