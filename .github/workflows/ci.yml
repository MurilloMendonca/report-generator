name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: repgen
          POSTGRES_PASSWORD: repgen
          POSTGRES_DB: repgen
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U repgen -d repgen"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap poppler-utils
          # Ubuntu 24.04 restricts unprivileged user namespaces, which bubblewrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -c requirements-lock.txt

      - name: Compile backend
        run: python -m compileall app

      - name: Run unit tests
        env:
          APP_ENV: test
          PDF_REPORT_REQUIRE_BWRAP: "1"
          TEST_DATABASE_URL: postgresql+psycopg://repgen:repgen@localhost:5432/repgen_test
        run: python -m unittest discover -s tests

      - name: Run frontend tests
        run: |
          for spec in tests/*.spec.js; do
            echo "::group::$spec"
            node "$spec"
            echo "::endgroup::"
          done
