services:
  report-generator:
    build: .
    container_name: pdf-report-generator
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ACCESS_SECRET: ${APP_ACCESS_SECRET:?APP_ACCESS_SECRET must be configured}
      PORT: 8000
      MPLCONFIGDIR: /tmp/matplotlib
    ports:
      - "${HOST_PORT:-8000}:8000"
    volumes:
      - ./workspace:/app/workspace
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
