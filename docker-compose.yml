services:
  report-generator:
    build:
      context: .
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    container_name: pdf-report-generator
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_ENCRYPTION_KEYS_FILE: /run/secrets/provider_encryption_keys
      APP_ENCRYPTION_ACTIVE_KEY: ${APP_ENCRYPTION_ACTIVE_KEY:-v1}
      # Links in emails point here.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://repgen.gengardev.com.br}
      # `closed`: accounts only via `python -m app.cli create-user`. Set `open`
      # after configuring SMTP and Turnstile for public registration.
      PDF_REPORT_SIGNUP_MODE: ${PDF_REPORT_SIGNUP_MODE:-closed}
      # Set to 0 only when serving over plain HTTP on a non-localhost address.
      PDF_REPORT_COOKIE_SECURE: ${PDF_REPORT_COOKIE_SECURE:-1}
      PORT: 8000
      # POSTGRES_PASSWORD must be URL-safe (for example `openssl rand -hex 24`).
      DATABASE_URL: postgresql+psycopg://repgen:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be configured}@postgres:5432/repgen
      MPLCONFIGDIR: /tmp/matplotlib
      # Real client IPs: trust CF-Connecting-IP only from these peers (see app/security.py).
      # A cloudflared on the host reaches the container through Docker's gateway:
      # 192.168.65.0/24 on Docker Desktop for Mac, 172.16.0.0/12 on Linux.
      PDF_REPORT_CLIENT_IP_HEADER: ${PDF_REPORT_CLIENT_IP_HEADER:-CF-Connecting-IP}
      PDF_REPORT_TRUSTED_PROXIES: ${PDF_REPORT_TRUSTED_PROXIES:-172.16.0.0/12,192.168.65.0/24}
    ports:
      # Localhost only: a cloudflared on the host can reach it, the LAN cannot.
      - "127.0.0.1:${HOST_PORT:-8000}:8000"
    volumes:
      # Must be writable by APP_UID (chown it if an older root-run container created it).
      - ./workspace:/app/workspace
    secrets:
      - provider_encryption_keys
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      # bubblewrap needs to create namespaces, which Docker's default seccomp and
      # AppArmor profiles block. Without these two lines report generation fails
      # unless PDF_REPORT_ALLOW_UNSAFE_SANDBOX=1 is set (weaker isolation).
      - seccomp=unconfined
      - apparmor=unconfined
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Reports, templates and (from Phase 2) accounts. No published port: only the
  # app reaches it. Data lives in a named volume inside Docker's VM, which is
  # faster and safer than a macOS bind mount. Back it up with scripts/backup.sh.
  postgres:
    image: postgres:17.6-alpine
    container_name: pdf-report-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: repgen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be configured}
      POSTGRES_DB: repgen
    volumes:
      - postgres-data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repgen -d repgen"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:

secrets:
  provider_encryption_keys:
    file: ${APP_ENCRYPTION_KEYS_PATH:-./secrets/provider-encryption-keys}
