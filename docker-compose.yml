services:
  report-generator:
    build:
      context: .
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    container_name: pdf-report-generator
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_ACCESS_SECRET: ${APP_ACCESS_SECRET:?APP_ACCESS_SECRET must be configured}
      # Set to 0 only when serving over plain HTTP on a non-localhost address.
      PDF_REPORT_COOKIE_SECURE: ${PDF_REPORT_COOKIE_SECURE:-1}
      PORT: 8000
      MPLCONFIGDIR: /tmp/matplotlib
      # Real client IPs: trust CF-Connecting-IP only from these peers (see app/security.py).
      PDF_REPORT_CLIENT_IP_HEADER: ${PDF_REPORT_CLIENT_IP_HEADER:-CF-Connecting-IP}
      PDF_REPORT_TRUSTED_PROXIES: ${PDF_REPORT_TRUSTED_PROXIES:-cloudflared,172.16.0.0/12,192.168.65.0/24}
    ports:
      # Localhost only: a cloudflared on the host can reach it, the LAN cannot.
      # With the `tunnel` profile below, nothing needs this port at all.
      - "127.0.0.1:${HOST_PORT:-8000}:8000"
    volumes:
      # Must be writable by APP_UID (chown it if an older root-run container created it).
      - ./workspace:/app/workspace
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      # bubblewrap needs to create namespaces, which Docker's default seccomp and
      # AppArmor profiles block. Without these two lines report generation fails
      # unless PDF_REPORT_ALLOW_UNSAFE_SANDBOX=1 is set (weaker isolation).
      - seccomp=unconfined
      - apparmor=unconfined
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Cloudflare Tunnel inside compose: `docker compose --profile tunnel up -d`.
  # In the Cloudflare dashboard, point the public hostname at
  # http://report-generator:8000 and put the tunnel token in .env as
  # CLOUDFLARE_TUNNEL_TOKEN.
  cloudflared:
    image: cloudflare/cloudflared:2026.9.2
    container_name: pdf-report-cloudflared
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      report-generator:
        condition: service_healthy
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
